<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>✈️ 纸飞机太空大战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0e1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            touch-action: none;
            overflow: hidden;
        }

        .game-wrapper {
            background: linear-gradient(145deg, #0f1a2e, #060a14);
            border-radius: 32px;
            padding: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .game-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: #0b0f1a;
            box-shadow: inset 0 0 40px rgba(0, 20, 60, 0.6);
            width: 400px;
            height: 700px;
            max-width: 100vw;
            max-height: 90vh;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: none;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(6, 10, 20, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: #fff;
            z-index: 10;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            padding: 24px;
            text-align: center;
            pointer-events: auto;
        }

        .overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .overlay .title {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #f0e6b0, #ffd966);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
            margin-bottom: 4px;
            letter-spacing: 2px;
        }

        .overlay .subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 28px;
            letter-spacing: 4px;
        }

        .overlay .emoji-big {
            font-size: 72px;
            margin-bottom: 12px;
            -webkit-text-fill-color: initial;
        }

        .overlay .score-final {
            font-size: 22px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
        }

        .overlay .score-final span {
            font-size: 36px;
            font-weight: 700;
            color: #ffd966;
        }

        .overlay .best-score {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 24px;
        }

        .btn {
            padding: 14px 48px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #f7d875, #f5a623);
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 30px rgba(245, 166, 35, 0.35);
            letter-spacing: 1px;
            touch-action: manipulation;
        }

        .btn:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 40px rgba(245, 166, 35, 0.5);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .controls-hint {
            position: absolute;
            bottom: 16px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 5;
            font-weight: 300;
        }

        .controls-hint span {
            display: inline-block;
            margin: 0 10px;
        }

        @media (max-width: 440px) {
            .game-wrapper {
                padding: 8px;
                border-radius: 20px;
            }
            .game-container {
                border-radius: 14px;
            }
            .overlay .title {
                font-size: 34px;
            }
            .overlay .emoji-big {
                font-size: 52px;
            }
            .btn {
                padding: 12px 32px;
                font-size: 16px;
            }
            .controls-hint {
                font-size: 10px;
                bottom: 10px;
            }
        }

        @media (max-height: 740px) {
            .game-container {
                max-height: 92vh;
            }
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .pulse {
            animation: pulse 1.8s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="game-container" id="gameContainer">
            <canvas id="gameCanvas" width="400" height="700"></canvas>

            <!-- 开始界面 -->
            <div class="overlay" id="startOverlay">
                <div class="emoji-big">✈️</div>
                <div class="title">太空大战</div>
                <div class="subtitle">纸飞机 · 星际争霸</div>
                <button class="btn" id="startBtn">开始战斗</button>
                <div style="margin-top:18px;font-size:13px;color:rgba(255,255,255,0.25);">
                    🎮 键盘 / 鼠标 · 触屏
                </div>
            </div>

            <!-- 结束界面 -->
            <div class="overlay hidden" id="gameOverOverlay">
                <div class="emoji-big">💥</div>
                <div class="title" style="font-size:36px;">坠毁</div>
                <div class="score-final">得分 <span id="finalScore">0</span></div>
                <div class="best-score">🏆 最高纪录 <span id="bestScore">0</span></div>
                <button class="btn" id="restartBtn">再来一次</button>
            </div>

            <div class="controls-hint">
                <span>← ↑ → ↓</span>
                <span>·</span>
                <span>空格射击</span>
                <span>·</span>
                <span>🖱 移动 + 点击</span>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  🚀  纸飞机太空大战  –  完整游戏 (修复启动问题)
        // ============================================================

        // ---------- DOM ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreSpan = document.getElementById('finalScore');
        const bestScoreSpan = document.getElementById('bestScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        // ---------- 尺寸 ----------
        const W = 400;
        const H = 700;
        canvas.width = W;
        canvas.height = H;

        // ---------- 最高分 ----------
        let bestScore = parseInt(localStorage.getItem('paperPlaneBest') || '0', 10);
        bestScoreSpan.textContent = bestScore;

        // ---------- 游戏状态 ----------
        let gameRunning = false;
        let score = 0;
        let lives = 3;
        let frame = 0;

        // ---------- 玩家 ----------
        const player = {
            x: W / 2,
            y: H - 110,
            w: 36,
            h: 44,
            speed: 4.8,
            shootCooldown: 0,
            shootDelay: 10,
            invincible: 0,
            tilt: 0,
        };

        // ---------- 动态实体 ----------
        let bullets = [];
        let enemies = [];
        let particles = [];
        let stars = [];

        // ---------- 输入 ----------
        const keys = { left: false, right: false, up: false, down: false, space: false };
        let mouseX = null;
        let mouseY = null;
        let mouseDown = false;
        let touchActive = false;
        let touchX = null;
        let touchY = null;

        // ---------- 初始化星空 ----------
        function initStars() {
            stars = [];
            for (let i = 0; i < 120; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    size: Math.random() * 2.2 + 0.5,
                    speed: Math.random() * 0.6 + 0.2,
                    brightness: Math.random() * 0.6 + 0.4,
                });
            }
        }
        initStars();

        // ---------- 重置游戏 ----------
        function resetGame() {
            score = 0;
            lives = 3;
            frame = 0;
            bullets = [];
            enemies = [];
            particles = [];
            player.x = W / 2;
            player.y = H - 110;
            player.shootCooldown = 0;
            player.invincible = 0;
            player.tilt = 0;
            // 不重置 stars，保留背景
            gameRunning = true;
        }

        // ---------- 纸飞机绘制 ----------
        function drawPaperPlane(x, y, w, h, tilt, color = '#ffffff') {
            const s = w / 36;
            const cx = x;
            const cy = y;

            ctx.save();
            ctx.translate(cx, cy);
            const tiltAngle = tilt * 0.04;
            ctx.rotate(tiltAngle);

            ctx.shadowColor = 'rgba(100, 180, 255, 0.15)';
            ctx.shadowBlur = 20;

            const bodyColor = color || '#f0f4ff';
            const darkColor = '#c8d8f0';

            // 主翼
            ctx.beginPath();
            ctx.moveTo(0, -h * 0.48);
            ctx.lineTo(-w * 0.55, h * 0.2);
            ctx.lineTo(-w * 0.2, h * 0.35);
            ctx.lineTo(0, h * 0.1);
            ctx.lineTo(w * 0.2, h * 0.35);
            ctx.lineTo(w * 0.55, h * 0.2);
            ctx.closePath();

            const grad = ctx.createLinearGradient(0, -h * 0.4, 0, h * 0.4);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.5, '#e8eeff');
            grad.addColorStop(1, '#b8c8e8');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = 'rgba(180, 200, 230, 0.3)';
            ctx.lineWidth = 0.5;
            ctx.stroke();

            // 折痕
            ctx.beginPath();
            ctx.moveTo(0, -h * 0.46);
            ctx.lineTo(0, h * 0.32);
            ctx.strokeStyle = 'rgba(150, 180, 220, 0.25)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, -h * 0.1);
            ctx.lineTo(-w * 0.4, h * 0.15);
            ctx.strokeStyle = 'rgba(150, 180, 220, 0.2)';
            ctx.lineWidth = 0.8;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, -h * 0.1);
            ctx.lineTo(w * 0.4, h * 0.15);
            ctx.strokeStyle = 'rgba(150, 180, 220, 0.2)';
            ctx.lineWidth = 0.8;
            ctx.stroke();

            // 机头高光
            ctx.beginPath();
            ctx.moveTo(0, -h * 0.46);
            ctx.lineTo(-w * 0.08, -h * 0.2);
            ctx.lineTo(w * 0.08, -h * 0.2);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fill();

            // 尾翼
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(-w * 0.2, h * 0.3);
            ctx.lineTo(-w * 0.42, h * 0.48);
            ctx.lineTo(-w * 0.22, h * 0.42);
            ctx.closePath();
            ctx.fillStyle = darkColor;
            ctx.fill();
            ctx.strokeStyle = 'rgba(160,180,210,0.2)';
            ctx.lineWidth = 0.5;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(w * 0.2, h * 0.3);
            ctx.lineTo(w * 0.42, h * 0.48);
            ctx.lineTo(w * 0.22, h * 0.42);
            ctx.closePath();
            ctx.fillStyle = darkColor;
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-w * 0.2, h * 0.3);
            ctx.lineTo(0, h * 0.38);
            ctx.lineTo(w * 0.2, h * 0.3);
            ctx.strokeStyle = 'rgba(160,180,210,0.15)';
            ctx.lineWidth = 0.8;
            ctx.stroke();

            // 驾驶舱
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.ellipse(0, -h * 0.12, w * 0.1, h * 0.14, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(180, 220, 255, 0.25)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(200, 230, 255, 0.15)';
            ctx.lineWidth = 0.5;
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(0, -h * 0.44, w * 0.05, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.fill();

            // 尾焰
            if (gameRunning) {
                const flicker = Math.random() * 0.3 + 0.7;
                ctx.shadowBlur = 30;
                ctx.shadowColor = 'rgba(100, 200, 255, 0.2)';
                ctx.beginPath();
                ctx.moveTo(-w * 0.12, h * 0.42);
                ctx.quadraticCurveTo(0, h * 0.62 * flicker, w * 0.12, h * 0.42);
                ctx.fillStyle = `rgba(150, 220, 255, ${0.08 * flicker})`;
                ctx.fill();

                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(100, 200, 255, 0.1)';
                ctx.beginPath();
                ctx.moveTo(-w * 0.06, h * 0.42);
                ctx.quadraticCurveTo(0, h * 0.52 * flicker, w * 0.06, h * 0.42);
                ctx.fillStyle = `rgba(200, 240, 255, ${0.12 * flicker})`;
                ctx.fill();
            }

            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // ---------- 敌机绘制 ----------
        function drawEnemy(e) {
            ctx.save();
            ctx.translate(e.x, e.y);
            const s = e.size / 30;
            const rot = e.rotation || 0;
            ctx.rotate(rot);

            const grad = ctx.createRadialGradient(0, 0, 2 * s, 0, 0, 16 * s);
            grad.addColorStop(0, e.colorLight || '#ff6b6b');
            grad.addColorStop(0.7, e.color || '#e74c3c');
            grad.addColorStop(1, e.colorDark || '#a93226');
            ctx.fillStyle = grad;

            ctx.beginPath();
            ctx.moveTo(0, -14 * s);
            ctx.lineTo(-16 * s, 8 * s);
            ctx.lineTo(-8 * s, 12 * s);
            ctx.lineTo(0, 6 * s);
            ctx.lineTo(8 * s, 12 * s);
            ctx.lineTo(16 * s, 8 * s);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 0.5;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, -2 * s, 6 * s, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(-2 * s, -4 * s, 2.5 * s, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fill();

            if (e.engineGlow) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = 'rgba(255, 100, 50, 0.3)';
                ctx.beginPath();
                ctx.moveTo(-6 * s, 12 * s);
                ctx.quadraticCurveTo(0, 18 * s, 6 * s, 12 * s);
                ctx.fillStyle = `rgba(255, 150, 80, ${0.2 + 0.15 * Math.sin(frame * 0.1 + e.x)})`;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        // ---------- 子弹绘制 ----------
        function drawBullet(b) {
            ctx.save();
            const grad = ctx.createLinearGradient(b.x, b.y - 12, b.x, b.y + 12);
            grad.addColorStop(0, 'rgba(180, 240, 255, 0)');
            grad.addColorStop(0.3, 'rgba(100, 220, 255, 0.9)');
            grad.addColorStop(0.7, 'rgba(100, 220, 255, 0.9)');
            grad.addColorStop(1, 'rgba(180, 240, 255, 0)');
            ctx.fillStyle = grad;

            ctx.shadowBlur = 25;
            ctx.shadowColor = 'rgba(100, 200, 255, 0.5)';

            const w = 4;
            const h = 14;
            ctx.beginPath();
            ctx.roundRect(b.x - w / 2, b.y - h / 2, w, h, 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath();
            ctx.roundRect(b.x - 1, b.y - 8, 2, 16, 1);
            ctx.fill();

            ctx.restore();
        }

        // ---------- 粒子 ----------
        function spawnExplosion(x, y, color, count = 30) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1.5;
                const size = Math.random() * 5 + 2;
                const life = Math.random() * 30 + 20;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 0.5,
                    size,
                    life,
                    maxLife: life,
                    color: color || '#ffd93d',
                    gravity: 0.04,
                    shrink: 0.97,
                });
            }
            for (let i = 0; i < 12; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2 + 1;
                const size = Math.random() * 3 + 1;
                const life = Math.random() * 20 + 10;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    size,
                    life,
                    maxLife: life,
                    color: '#ffffff',
                    gravity: 0.02,
                    shrink: 0.96,
                });
            }
        }

        // ---------- 生成敌人 ----------
        function spawnEnemy() {
            const types = [
                { size: 28, speed: 1.4, hp: 1, color: '#e74c3c', colorLight: '#ff6b6b', colorDark: '#a93226',
                score: 10 },
                { size: 32, speed: 1.0, hp: 2, color: '#9b59b6', colorLight: '#c39bd3', colorDark: '#6c3483',
                score: 15 },
                { size: 24, speed: 2.0, hp: 1, color: '#f39c12', colorLight: '#f7dc6f', colorDark: '#b7950b',
                score: 12 },
                { size: 20, speed: 2.6, hp: 1, color: '#1abc9c', colorLight: '#76d7c4', colorDark: '#0e6655',
                score: 8 },
            ];
            const t = types[Math.floor(Math.random() * types.length)];
            const x = 30 + Math.random() * (W - 60);
            const y = -40;
            enemies.push({
                x,
                y,
                size: t.size,
                speed: t.speed + (Math.random() - 0.5) * 0.5,
                hp: t.hp,
                maxHp: t.hp,
                color: t.color,
                colorLight: t.colorLight,
                colorDark: t.colorDark,
                score: t.score,
                rotation: 0,
                rotSpeed: (Math.random() - 0.5) * 0.02,
                engineGlow: true,
                wobble: Math.random() * 100,
                wobbleSpeed: 0.02 + Math.random() * 0.02,
                wobbleAmp: 0.3 + Math.random() * 0.5,
            });
        }

        // ---------- 碰撞检测 ----------
        function rectCollide(ax, ay, aw, ah, bx, by, bw, bh) {
            return ax - aw / 2 < bx + bw / 2 &&
                ax + aw / 2 > bx - bw / 2 &&
                ay - ah / 2 < by + bh / 2 &&
                ay + ah / 2 > by - bh / 2;
        }

        // ---------- 射击 ----------
        function shootBullet() {
            if (player.shootCooldown > 0) return;
            bullets.push({ x: player.x, y: player.y - player.h * 0.45, vx: 0, vy: -7.5, w: 4, h: 14 });
            bullets.push({ x: player.x - 8, y: player.y - player.h * 0.35, vx: -0.5, vy: -7.2, w: 3, h: 12 });
            bullets.push({ x: player.x + 8, y: player.y - player.h * 0.35, vx: 0.5, vy: -7.2, w: 3, h: 12 });
            player.shootCooldown = player.shootDelay;
        }

        // ---------- 更新 ----------
        function update() {
            if (!gameRunning) return;
            frame++;

            let dx = 0,
                dy = 0;
            if (keys.left) dx = -1;
            if (keys.right) dx = 1;
            if (keys.up) dy = -1;
            if (keys.down) dy = 1;

            // 触摸控制
            if (touchActive && touchX !== null && touchY !== null) {
                const targetX = touchX;
                const targetY = touchY;
                const diffX = targetX - player.x;
                const diffY = targetY - player.y;
                const dist = Math.hypot(diffX, diffY);
                if (dist > 2) {
                    const move = Math.min(player.speed * 1.2, dist);
                    player.x += (diffX / dist) * move;
                    player.y += (diffY / dist) * move;
                }
                player.tilt += (diffX * 0.03 - player.tilt) * 0.08;
                if (frame % 5 === 0) shootBullet();
            } else if (dx !== 0 || dy !== 0) {
                const len = Math.hypot(dx, dy);
                player.x += (dx / len) * player.speed;
                player.y += (dy / len) * player.speed;
                const targetTilt = dx * 2.5;
                player.tilt += (targetTilt - player.tilt) * 0.1;
            } else {
                player.tilt *= 0.92;
            }

            // 边界
            const halfW = player.w / 2;
            const halfH = player.h / 2;
            player.x = Math.max(halfW + 4, Math.min(W - halfW - 4, player.x));
            player.y = Math.max(halfH + 20, Math.min(H - halfH - 10, player.y));

            if (player.shootCooldown > 0) player.shootCooldown--;
            if (keys.space && player.shootCooldown === 0) shootBullet();

            // 鼠标点击射击 (在事件中触发)
            if (mouseDown && !touchActive) {
                // 在 mousedown 中已经触发了射击
            }

            if (player.invincible > 0) player.invincible--;

            // 子弹更新
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx || 0;
                b.y += b.vy || 0;
                if (b.y < -20 || b.x < -20 || b.x > W + 20) bullets.splice(i, 1);
            }

            // 敌人更新
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.y += e.speed;
                e.wobble += e.wobbleSpeed;
                e.x += Math.sin(e.wobble) * e.wobbleAmp * 0.3;
                e.rotation += e.rotSpeed;

                if (e.y > H + 50) {
                    enemies.splice(i, 1);
                    continue;
                }

                // 玩家碰撞
                if (player.invincible === 0) {
                    if (rectCollide(player.x, player.y, player.w * 0.7, player.h * 0.7,
                            e.x, e.y, e.size * 0.8, e.size * 0.8)) {
                        lives--;
                        player.invincible = 60;
                        spawnExplosion(e.x, e.y, '#ff6b6b', 40);
                        spawnExplosion(player.x, player.y, '#ffd93d', 20);
                        enemies.splice(i, 1);
                        if (lives <= 0) {
                            gameOver();
                            return;
                        }
                        continue;
                    }
                }

                // 子弹碰撞
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    if (rectCollide(b.x, b.y, b.w, b.h, e.x, e.y, e.size * 0.7, e.size * 0.7)) {
                        bullets.splice(j, 1);
                        e.hp--;
                        if (e.hp <= 0) {
                            score += e.score || 10;
                            spawnExplosion(e.x, e.y, e.color, 35);
                            enemies.splice(i, 1);
                            if (score > bestScore) {
                                bestScore = score;
                                localStorage.setItem('paperPlaneBest', String(bestScore));
                                bestScoreSpan.textContent = bestScore;
                            }
                        } else {
                            spawnExplosion(e.x, e.y, '#ffffff', 6);
                        }
                        break;
                    }
                }
            }

            // 生成敌人
            const baseInterval = Math.max(18, 55 - Math.floor(score / 80));
            if (frame % baseInterval === 0) spawnEnemy();
            if (score > 100 && frame % (baseInterval * 1.6) === 0) spawnEnemy();
            if (score > 250 && frame % (baseInterval * 2.2) === 0) spawnEnemy();

            // 粒子更新
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx || 0;
                p.y += p.vy || 0;
                p.vy += p.gravity || 0.02;
                p.size *= p.shrink || 0.97;
                p.life--;
                if (p.life <= 0 || p.size < 0.3) particles.splice(i, 1);
            }

            // 星星
            for (const star of stars) {
                star.y += star.speed;
                if (star.y > H) { star.y = 0;
                    star.x = Math.random() * W; }
            }
        }

        // ---------- 渲染 ----------
        function draw() {
            ctx.clearRect(0, 0, W, H);

            const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
            bgGrad.addColorStop(0, '#060a18');
            bgGrad.addColorStop(0.4, '#0c1628');
            bgGrad.addColorStop(0.7, '#0f1a30');
            bgGrad.addColorStop(1, '#0a0f1e');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            const nebula = ctx.createRadialGradient(300, 200, 20, 300, 200, 250);
            nebula.addColorStop(0, 'rgba(40, 60, 120, 0.05)');
            nebula.addColorStop(0.5, 'rgba(80, 40, 120, 0.04)');
            nebula.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = nebula;
            ctx.fillRect(0, 0, W, H);

            const nebula2 = ctx.createRadialGradient(80, 500, 30, 80, 500, 200);
            nebula2.addColorStop(0, 'rgba(20, 80, 140, 0.05)');
            nebula2.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = nebula2;
            ctx.fillRect(0, 0, W, H);

            for (const star of stars) {
                const alpha = star.brightness * (0.7 + 0.3 * Math.sin(frame * 0.02 + star.x));
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();
            }

            for (const p of particles) {
                const alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(0.5, p.size * alpha), 0, Math.PI * 2);
                ctx.fillStyle = p.color || '#ffd93d';
                ctx.fill();
                ctx.shadowBlur = 12;
                ctx.shadowColor = p.color || '#ffd93d';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            ctx.globalAlpha = 1;

            for (const b of bullets) drawBullet(b);

            for (const e of enemies) {
                drawEnemy(e);
                if (e.maxHp > 1) {
                    const bw = e.size * 0.8;
                    const bh = 3;
                    const bx = e.x - bw / 2;
                    const by = e.y - e.size * 0.7 - 6;
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.roundRect(bx, by, bw, bh, 2);
                    ctx.fill();
                    ctx.fillStyle = '#4ade80';
                    ctx.roundRect(bx, by, bw * (e.hp / e.maxHp), bh, 2);
                    ctx.fill();
                }
            }

            // 玩家
            if (player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }
            drawPaperPlane(player.x, player.y, player.w, player.h, player.tilt);
            ctx.globalAlpha = 1;

            const glow = ctx.createRadialGradient(player.x, player.y + 10, 5, player.x, player.y + 10, 60);
            glow.addColorStop(0, 'rgba(100, 200, 255, 0.04)');
            glow.addColorStop(1, 'rgba(100, 200, 255, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(player.x, player.y + 10, 60, 0, Math.PI * 2);
            ctx.fill();

            // HUD
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.font = 'bold 22px "Segoe UI", system-ui, sans-serif';
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.fillStyle = '#f0f4ff';
            ctx.fillText(`⭐ ${score}`, 16, 16);
            ctx.shadowBlur = 0;

            ctx.textAlign = 'right';
            ctx.font = '18px "Segoe UI", system-ui, sans-serif';
            let livesStr = '';
            for (let i = 0; i < lives; i++) livesStr += '✈️';
            ctx.fillStyle = '#f0f4ff';
            ctx.fillText(livesStr, W - 14, 16);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.font = '11px "Segoe UI", system-ui, sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.fillText('✦ 太空纸飞机 ✦', W / 2, H - 8);

            ctx.shadowBlur = 0;
            const borderGrad = ctx.createLinearGradient(0, 0, W, 0);
            borderGrad.addColorStop(0, 'rgba(100, 180, 255, 0)');
            borderGrad.addColorStop(0.3, 'rgba(100, 180, 255, 0.03)');
            borderGrad.addColorStop(0.7, 'rgba(100, 180, 255, 0.03)');
            borderGrad.addColorStop(1, 'rgba(100, 180, 255, 0)');
            ctx.fillStyle = borderGrad;
            ctx.fillRect(0, 0, W, 2);
            ctx.fillRect(0, H - 2, W, 2);
        }

        // ---------- 游戏结束 ----------
        function gameOver() {
            gameRunning = false;
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('paperPlaneBest', String(bestScore));
                bestScoreSpan.textContent = bestScore;
            }
            finalScoreSpan.textContent = score;
            bestScoreSpan.textContent = bestScore;
            gameOverOverlay.classList.remove('hidden');
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    spawnExplosion(
                        player.x + (Math.random() - 0.5) * 80,
                        player.y + (Math.random() - 0.5) * 60,
                        ['#ff6b6b', '#ffd93d', '#ff9f43', '#ffffff'][Math.floor(Math.random() * 4)],
                        25
                    );
                }, i * 60);
            }
        }

        // ---------- 游戏循环 ----------
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ---------- 事件绑定 ----------
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'ArrowLeft' || key === 'Left' || key === 'a' || key === 'A') { keys.left = true;
                e.preventDefault(); }
            if (key === 'ArrowRight' || key === 'Right' || key === 'd' || key === 'D') { keys.right = true;
                e.preventDefault(); }
            if (key === 'ArrowUp' || key === 'Up' || key === 'w' || key === 'W') { keys.up = true;
                e.preventDefault(); }
            if (key === 'ArrowDown' || key === 'Down' || key === 's' || key === 'S') { keys.down = true;
                e.preventDefault(); }
            if (key === ' ') { keys.space = true;
                e.preventDefault(); }
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(key)) e.preventDefault();
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key;
            if (key === 'ArrowLeft' || key === 'Left' || key === 'a' || key === 'A') { keys.left = false;
                e.preventDefault(); }
            if (key === 'ArrowRight' || key === 'Right' || key === 'd' || key === 'D') { keys.right = false;
                e.preventDefault(); }
            if (key === 'ArrowUp' || key === 'Up' || key === 'w' || key === 'W') { keys.up = false;
                e.preventDefault(); }
            if (key === 'ArrowDown' || key === 'Down' || key === 's' || key === 'S') { keys.down = false;
                e.preventDefault(); }
            if (key === ' ') { keys.space = false;
                e.preventDefault(); }
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(key)) e.preventDefault();
        });

        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
        }

        canvas.addEventListener('mousemove', (e) => {
            const pos = getCanvasPos(e);
            mouseX = pos.x;
            mouseY = pos.y;
            if (touchActive || !gameRunning) return;
            const dx = mouseX - player.x;
            const dy = mouseY - player.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 1) {
                const move = Math.min(player.speed * 1.0, dist);
                player.x += (dx / dist) * move;
                player.y += (dy / dist) * move;
                player.tilt += (dx * 0.025 - player.tilt) * 0.08;
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            mouseDown = true;
            if (gameRunning) {
                shootBullet();
                const pos = getCanvasPos(e);
                mouseX = pos.x;
                mouseY = pos.y;
            }
        });

        canvas.addEventListener('mouseup', () => { mouseDown = false; });
        canvas.addEventListener('mouseleave', () => { mouseDown = false;
            mouseX = null;
            mouseY = null; });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            if (!touch) return;
            touchActive = true;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            touchX = (touch.clientX - rect.left) * scaleX;
            touchY = (touch.clientY - rect.top) * scaleY;
            if (gameRunning) shootBullet();
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            if (!touch) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            touchX = (touch.clientX - rect.left) * scaleX;
            touchY = (touch.clientY - rect.top) * scaleY;
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            touchActive = false;
            touchX = null;
            touchY = null;
        }, { passive: false });
        canvas.addEventListener('touchcancel', () => {
            touchActive = false;
            touchX = null;
            touchY = null;
        });

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                return this;
            };
        }

        // ---------- 开始 / 重新开始 ----------
        function startGame() {
            // 重置所有数据
            resetGame();
            // 隐藏所有覆盖层
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            // 确保游戏运行标志为 true
            gameRunning = true;
            // 清空残留敌人和子弹（重置已做）
            // 重置玩家位置
            player.x = W / 2;
            player.y = H - 110;
            player.invincible = 0;
            player.tilt = 0;
            // 更新最高分显示
            bestScoreSpan.textContent = bestScore;
        }

        // 修正按钮事件
        startBtn.addEventListener('click', (e) => {
            e.preventDefault();
            startGame();
        });

        restartBtn.addEventListener('click', (e) => {
            e.preventDefault();
            startGame();
        });

        // 防止页面滚动
        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('.game-container')) e.preventDefault();
        }, { passive: false });

        // ---------- 启动循环 ----------
        gameLoop();

        // 初始状态：显示开始界面，游戏未运行
        gameRunning = false;
        // 绘制一帧背景让玩家看到
        draw();

        console.log('✈️ 纸飞机太空大战已加载！');
        console.log('🎮 控制: 方向键/WASD 移动 | 空格射击 | 鼠标/触屏亦可');
        console.log(`🏆 当前最高分: ${bestScore}`);
    </script>
</body>
</html>
